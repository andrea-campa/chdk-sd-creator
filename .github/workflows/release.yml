name: Release

# Push a version tag (e.g. v0.1.0) to build a universal macOS app and
# attach the .dmg to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: CHDK SD Creator ${{ github.ref_name }}
          releaseBody: |
            Download the `.dmg`, open it and drag **CHDK SD Creator** into Applications.

            The app isn't notarized yet: the first time you open it, go to
            **System Settings → Privacy & Security** and click **Open Anyway**.

            See [CHANGELOG.md](https://github.com/andrea-campa/chdk-sd-creator/blob/main/CHANGELOG.md) for what's new.
          releaseDraft: true
          prerelease: false
