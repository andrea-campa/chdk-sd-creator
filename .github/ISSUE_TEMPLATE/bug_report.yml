name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and firmware
      placeholder: e.g. IXUS 90 IS, firmware 1.00C
  - type: dropdown
    id: method
    attributes:
      label: Start method
      options:
        - Firmware Update
        - Autoboot
        - Not relevant
  - type: input
    id: card
    attributes:
      label: SD card
      placeholder: e.g. 8 GB SDHC, FAT32, built-in SD slot
  - type: textarea
    id: log
    attributes:
      label: Install log or error message
      description: Copy it from the app (Install step → Install log).
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: e.g. macOS 15.3, MacBook Air M2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0
