[package]
name = "chdk-sd-creator"
version = "0.1.0"
description = "Prepare SD cards with CHDK for Canon PowerShot / IXUS cameras"
edition = "2021"

[lib]
name = "chdk_sd_creator_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = "1"

# Keep build output small: no debug info, no incremental cache.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
