[package]
name = "chdk-sd-creator"
version = "0.1.0"
description = "Desktop app that prepares SD cards with CHDK for Canon PowerShot and IXUS cameras"
authors = ["Andrea Campa"]
license = "GPL-3.0-or-later"
repository = "https://github.com/andrea-campa/chdk-sd-creator"
homepage = "https://github.com/andrea-campa/chdk-sd-creator"
readme = "../README.md"
keywords = ["chdk", "canon", "powershot", "sd-card", "tauri"]
categories = ["multimedia::images", "filesystem"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "chdk_sd_creator_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = "1"

# Keep build output small: no debug info, no incremental cache.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
